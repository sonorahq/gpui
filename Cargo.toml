[workspace]
resolver = "2"
members = [
    "crates/collections",
    "crates/gpui",
    "crates/gpui_apple",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_windows",
    "crates/gpui_shared_string",
    "crates/gpui_util",
    "crates/gpui_wgpu",
    "crates/http_client",
    "crates/media",
    "crates/path",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/zlog",
    "crates/ztracing",
    "crates/ztracing_macro",
    "tooling/perf",
]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
